<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hunting | RDR2 Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="components.css">
  <style>
    .landing-container { max-width: 1100px; margin: 0 auto; }

    .landing-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 14px 0 18px;
      max-width: 720px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    .landing-card {
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      min-height: 120px;
    }

    .landing-card:hover { transform: translateY(-1px); border-color: var(--gold); }

    .landing-card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .landing-card h3 {
      font-family: 'Rye', cursive;
      font-size: 1rem;
      color: var(--rust);
      margin: 0;
    }

    .landing-card .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      background: var(--bg-dark);
      white-space: nowrap;
    }

    .landing-card p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
  </style>
  <!-- Vercel Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
  <script src="components.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="utils.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <!-- Sign In Modal -->
  <div data-component="signInModal"></div>

  <div class="container landing-container">
    <script>document.write(Components.header({ backHref: "/", backText: "Back to Home", title: "Hunting", subtitle: "Perfect pelts & legendary hunts", showAuth: true }))</script>

    <main>
      <section class="landing-grid">
        <div class="landing-card" onclick="window.location.href='animals.html'">
          <div class="landing-card-title">
            <h3>Animal Finder</h3>
            <span class="badge">Guided</span>
          </div>
          <p>Pick an animal and instantly see the recommended weapon + ammo.</p>
        </div>

        <div class="landing-card" onclick="window.location.href='animals.html'">
          <div class="landing-card-title">
            <h3>All Animals</h3>
            <span class="badge">Table</span>
          </div>
          <p>Browse and filter by size/type (legendary/fish) with quick links to details.</p>
        </div>

        <div class="landing-card" onclick="window.location.href='weapon-gear.html'">
          <div class="landing-card-title">
            <h3>Hunting Gear (Weapons)</h3>
            <span class="badge">Gear</span>
          </div>
          <p>Ammo types + weapon notes that matter for perfect pelts.</p>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>
  </div>
</body>
</html>
